[project]
name = "house-price-predict-ml"
version = "0.1.0"
description = "House price prediction and dataset exploration"
readme = "README.md"
authors = [
    { name = "Sakib669", email = "stewieboyyy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
house-price-predict-ml = "house_price_predict_ml.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
